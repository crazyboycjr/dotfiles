<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- PDFs that don't embed their fonts name them by PostScript name -->
  <alias binding="same">
    <family>ArialMT</family>
    <accept><family>Arial</family></accept>
  </alias>
  <alias binding="same">
    <family>TimesNewRomanPSMT</family>
    <accept><family>Times New Roman</family></accept>
  </alias>
  <alias binding="same">
    <family>TimesNewRomanPS</family>
    <accept><family>Times New Roman</family></accept>
  </alias>
  <alias binding="same">
    <family>SymbolMT</family>
    <accept><family>Symbol</family></accept>
  </alias>

  <match target="font">
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <match>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Adwaita Sans</string>
      <string>PingFang SC</string>
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Times New Roman</string>
      <string>LXGW WenKai GB Screen</string>
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>
  <match>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Monaco</string>
      <string>LXGW WenKai Mono GB Screen</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
</fontconfig>
