backend = "glx";
vsync = true;
shadow = false;
fading = false;
unredir-if-possible = true;
unredir-if-possible-delay = 200;
# NVIDIA holds back GPU work while X's VT is in the background, and picom's frame-pacing
# vblank wait then stalls 12 s after a VT switch (picom #1527); without pacing it renders on damage
no-frame-pacing = true;
